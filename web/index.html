<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shiroe Syn Studio</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">Shiroe Syn <b>Studio</b></div>
    <div id="sysinfo" class="muted small"></div>
    <section id="backend" class="box" hidden></section>

    <nav id="tabs" class="tabs">
      <button data-mode="scratch">🎬 Dari Nol <span class="cnt"></span></button>
      <button data-mode="clipper">✂ Clipper <span class="cnt"></span></button>
    </nav>
    <section id="newproj" class="box"></section>

    <div class="row between">
      <h3>Proyek</h3>
      <div class="row">
        <button id="btn-health" class="ghost small" title="Cek kesiapan aplikasi">🩺 Cek</button>
        <button id="btn-schedule" class="ghost small">📅 Jadwal</button>
      </div>
    </div>
    <ul id="project-list"></ul>
  </aside>

  <main id="main">
    <div class="empty">
      <h1>Selamat datang 👋</h1>
      <p>Memuat…</p>
    </div>
  </main>

  <div id="statusbar" hidden></div>
  <div id="toast" hidden></div>
  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="ghost">Tutup</button></form></dialog>

  <script src="static/app.js"></script>
</body>
</html>
