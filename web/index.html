<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shiroe Syn Studio</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">Shiroe Syn <b>Studio</b></div>
    <div id="sysinfo" class="muted small"></div>
    <section id="backend" class="box" hidden></section>

    <section class="box">
      <h3>Proyek baru</h3>
      <label class="field"><span>Jalur</span>
        <select id="np-mode">
          <option value="scratch">1 · Konten dari nol</option>
          <option value="clipper">2 · Clipper (video / link YouTube)</option>
        </select>
      </label>
      <label class="field"><span>Format</span>
        <select id="np-format">
          <option value="short">Short (9:16, ≤60 dtk)</option>
          <option value="long">Long (16:9)</option>
        </select>
      </label>
      <label class="field"><span>Kata kunci / judul kerja</span>
        <input id="np-title" placeholder="mis. misteri sejarah nusantara">
      </label>
      <button id="np-create" class="primary">+ Buat proyek</button>
    </section>

    <div class="row between">
      <h3>Proyek</h3>
      <button id="btn-schedule" class="ghost small">📅 Jadwal</button>
    </div>
    <ul id="project-list"></ul>
  </aside>

  <main id="main">
    <div class="empty">
      <h1>Selamat datang 👋</h1>
      <p>Buat proyek baru di kiri, lalu ikuti 7 tahap. Di setiap tahap Anda bisa
        menjalankan AI, <b>mengedit manual</b>, lalu <b>Setujui &amp; Lanjut</b>.</p>
    </div>
  </main>

  <div id="statusbar" hidden></div>
  <div id="toast" hidden></div>
  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="ghost">Tutup</button></form></dialog>

  <script src="static/app.js"></script>
</body>
</html>
