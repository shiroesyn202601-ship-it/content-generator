<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141413">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Shiroe Syn Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="static/style.css?v=20261118a">
</head>
<body>
  <!-- ikon garis, dipakai lewat <use href="#i-..."> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-scratch" viewBox="0 0 24 24"><path d="M4 20h16M6 16l9.5-9.5a2.1 2.1 0 0 1 3 3L9 19H6v-3z"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6 20 18M8.6 16.4 20 6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5 12 13l2.5 2.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  </svg>

  <header id="topbar">
    <button id="nav-toggle" class="icon-btn" aria-label="Buka menu proyek" aria-expanded="false" aria-controls="sidebar">
      <svg class="ico"><use href="#i-menu"/></svg>
    </button>
    <div class="tb-brand"><span class="mark"></span>Shiroe Syn</div>
    <div id="topbar-mode" class="tb-mode"></div>
  </header>

  <aside id="sidebar">
    <div class="brand"><span class="mark"></span>Shiroe Syn <small>Studio</small></div>
    <div id="sysinfo" class="sysinfo"></div>
    <section id="backend" class="box" hidden></section>

    <nav id="tabs" class="tabs side-tabs">
      <button data-mode="scratch"><svg class="ico"><use href="#i-scratch"/></svg>Dari Nol<span class="cnt"></span></button>
      <button data-mode="clipper"><svg class="ico"><use href="#i-clip"/></svg>Clipper<span class="cnt"></span></button>
      <button data-mode="publish"><svg class="ico"><use href="#i-upload"/></svg>Upload<span class="cnt"></span></button>
    </nav>
    <section id="newproj" class="box"></section>

    <div class="row between list-head">
      <h3>Proyek</h3>
      <button id="btn-health" class="ghost small" title="Cek kesiapan aplikasi">Cek kesiapan</button>
    </div>
    <ul id="project-list"></ul>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <div class="empty">
      <p>Memuat…</p>
    </div>
  </main>

  <nav id="bottomnav" class="tabs bottom-tabs" aria-label="Ruang kerja">
    <button data-mode="scratch"><svg class="ico"><use href="#i-scratch"/></svg><span>Dari Nol</span><span class="cnt"></span></button>
    <button data-mode="clipper"><svg class="ico"><use href="#i-clip"/></svg><span>Clipper</span><span class="cnt"></span></button>
    <button data-mode="publish"><svg class="ico"><use href="#i-upload"/></svg><span>Upload</span><span class="cnt"></span></button>
  </nav>

  <div id="statusbar" hidden></div>
  <div id="bgtray" hidden aria-live="polite"></div>
  <div id="toast" hidden></div>
  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="ghost">Tutup</button></form></dialog>

  <script src="static/app.js?v=20261118a"></script>
</body>
</html>
